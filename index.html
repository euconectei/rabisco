    <script>
      // Sets <html lang> before the bundle loads, mirroring src/i18n/storage.ts and languages.ts.
      (function () {
        var lang = null
        var path = window.location.pathname
        if (path === '/en' || path.indexOf('/en/') === 0) {
          lang = 'en'
        } else {
          try {
            lang = localStorage.getItem('rabisco.lang')
          } catch (e) {}
          if (lang !== 'pt-BR' && lang !== 'en') {
            lang = (navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt-BR' : 'en'
          }
        }
        document.documentElement.lang = lang
      })()
    </script>
