name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Unit tests with coverage (70% gate)
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build
      - name: E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.enabled == 'true'
        run: npx --yes wrangler@4.149.0 pages deploy dist --project-name rabisco --branch main --commit-hash "$GITHUB_SHA"
